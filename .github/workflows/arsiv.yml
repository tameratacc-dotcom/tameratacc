{"name": "arsiv-gorselleri", "on": {"push": {"paths": [".github/workflows/arsiv.yml"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"indir": {"runs-on": "ubuntu-latest", "timeout-minutes": 30, "steps": [{"uses": "actions/checkout@v4"}, {"name": "indir", "run": "set -x\nsudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null\nmkdir -p dl/env dl/commons dl/arsiv dl/goad\nUA='Mozilla/5.0 (X11; Linux x86_64) research-izmir-basin-mirasi'\ncurl -sSL -A \"$UA\" -o dl/env/envanter.pdf 'https://www.izmeda.org/wp-content/uploads/2023/09/izmir_heykel_ve_anitlari.pdf' || true\nls -la dl/env\nn=$(pdfinfo dl/env/envanter.pdf | awk '/^Pages/{print $2}')\nfor p in $(seq 1 $n); do echo \"=== SAYFA $p\" >> dl/env/tam_metin.txt; pdftotext -f $p -l $p -layout dl/env/envanter.pdf - >> dl/env/tam_metin.txt; done\nfor p in $(seq 1 $n); do pdftotext -f $p -l $p dl/env/envanter.pdf - | grep -q -E 'Mumcu|lhan|Coşkun|Kurşun|Tahs|Gazetec|Emeç|Kışlal|pekç|Basın|Nevres|Hasan' && echo $p >> dl/env/sayfalar.txt; done\nfor p in $(cat dl/env/sayfalar.txt); do pdfimages -j -f $p -l $p dl/env/envanter.pdf dl/env/img_$p; pdftoppm -r 90 -jpeg -f $p -l $p dl/env/envanter.pdf dl/env/sayfa_$p; done\nfor f in Izmir_First_Bullet_Monument_at_Konak_Square_2527.jpg Izmir_First_Bullet_Monument_at_Konak_Square_2525.jpg 'First_Bullet_Monument_(2).jpg' 'First_Bullet_Monument_(4).jpg' Commemoration_of_Hasan_Tahsin_01.jpg Commemoration_of_Hasan_Tahsin_02.jpg 'Smyrne._Fa%C3%A7ade_de_la_grande_caserne_-_DPLA_-_19298df6444a3c2d1380b5e7c10997f6_(page_1).jpg'; do curl -sSL -A \"$UA\" -o \"dl/commons/$(echo $f | sed 's/%C3%A7/c/')\" \"https://commons.wikimedia.org/wiki/Special:FilePath/$f?width=2400\" || true; done\ncurl -sSL -A \"$UA\" -o dl/arsiv/salt_AHIZM251.jpg 'https://archives.saltresearch.org/bitstream/123456789/208302/1/AHIZM251.jpg' || true\ncurl -sSL -A \"$UA\" -o dl/goad/indeks_tam.jpg 'https://gallica.bnf.fr/iiif/ark:/12148/btv1b101006169/f1/full/3000,/0/native.jpg' || true\ncurl -sSL -A \"$UA\" -o dl/goad/indeks_kesit.jpg 'https://gallica.bnf.fr/iiif/ark:/12148/btv1b101006169/f1/pct:20,53,78,47/3000,/0/native.jpg' || true\nfor a in 2:btv1b10100612h 3:btv1b10100613z 4:btv1b10100607b 5:btv1b10100614d 6:btv1b10100608s 7:btv1b101006112 8:btv1b10100610m 9:btv1b101006097 10:btv1b10100605f 11:btv1b10100606w; do k=${a%%:*}; id=${a##*:}; curl -sSL -A \"$UA\" -o dl/goad/pafta_$k.jpg \"https://gallica.bnf.fr/iiif/ark:/12148/$id/f1/full/3200,/0/native.jpg\" || true; sleep 2; done\ns=$(stat -c%s dl/env/envanter.pdf || echo 0); if [ \"$s\" -gt 95000000 ]; then rm dl/env/envanter.pdf; fi\ndu -sh dl/*; ls -la dl/commons dl/arsiv dl/goad\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add dl\ngit commit -m 'arsiv gorselleri ve envanter'\ngit push"}]}}}
